id: D-0044
decision: Route a channel's message handling through the shared `conversation.js`; a new channel passes in only what differs instead of copying it.
reason: Telegram, GitHub, Slack and Discord share one conversation flow.
rejected:
- copying conversation logic per channel
scope:
