[package]
name = "wisp-push"
description = "wisp.push: the push transport for wisp.channels (phones paired by their own keys, notes sealed with HPKE, posted through the grid relay)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "sync"] }
tracing.workspace = true
wisp-channels-api.workspace = true
wisp-kernel.workspace = true
wisp-push-api.workspace = true
wisp-push-core.workspace = true
wisp-resources-api.workspace = true
wisp-runtime-api.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wisp-testkit.workspace = true
wisp-store.workspace = true
wisp-channels = { path = "../../channels/host" }
wisp-resources = { path = "../../resources/host" }
wisp-runtime-api = { workspace = true, features = ["testing"] }

[lints]
workspace = true
