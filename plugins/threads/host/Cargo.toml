wisp-mcp-api.workspace = true
wisp-runtime-api.workspace = true
wisp-store.workspace = true
wisp-threads-api.workspace = true
wisp-threads-core.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
wisp-testkit.workspace = true

[lints]
workspace = true
