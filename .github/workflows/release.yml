name: release

# Three channels, the way most npm projects run them (TypeScript's next, React's canary, Neovim's
# rolling nightly): stable on npm `latest`, beta on npm `next`, nightly on npm `nightly` plus a
# GitHub prerelease tagged `nightly` that's replaced every night. wisp's updater follows whichever
# one Settings → General → Updates names.
#
# Alpha is the public channel while wisp is in alpha: a version x.y.z-alpha.N ships exactly like a
# stable one (npm `latest`, the GitHub release marked Latest, so /releases/latest, the site's download
# links and the app's updater on its default channel all see it, and Homebrew), and npm's `alpha`
# dist-tag also names it. Only x.y.z-alpha.<number> is an alpha; any other `-` (beta.N, rc.N) is a
# beta. The rule is npm/scripts/release.mjs releaseKind (tested); the plan job's `prerelease` output,
# which decides --prerelease, --latest and Homebrew below, comes from it.
#
# What ships on npm (npm/README.md, ADR-0013): `wisp-agents`, a dependency-free launcher carrying the
# web build in web/, and per target the Rust `wisp` binary as a version of wisp-agents itself,
# `<version>-<os>-<arch>` under the dist-tag platform-<os>-<arch> (ADR-0094); the launcher depends on each through an
# npm alias (wisp-agents-<os>-<arch>), so npm installs only the one that matches the machine. The targets, their Rust triples and
# runners, the version checks, the dist-tag and the publish order are npm/scripts/release.mjs (tested
# by npm/test/release.test.mjs), so this file only runs them.
#
# Stable and beta: merge a PR that bumps the version in Cargo.toml's [workspace.package] and
# npm/wisp-agents/package.json together (with its CHANGELOG section; the release skill). The plan job
# fails at once if the two (or the launcher's optionalDependencies pins, or a tag the run is on)
# disagree. A version with a `-` (2.1.0-beta.1) is a beta: npm `next`, a GitHub prerelease, no Homebrew;
# x.y.z-alpha.N is an alpha, which ships as stable does (above). Either way this:
#   1. builds `wisp` for every target (binaries) and the desktop app on Tauri (tauri-package.yml):
#      macOS dmg + zip, Windows installer, Linux AppImage + deb, with the install gate on them
#   2. fills the npm packages with npm/scripts/build.mjs, runs the launcher's tests and installs the
#      packed linux-x64 tarballs to run `wisp --version` and `wisp serve` from them (packages)
#   3. creates the GitHub release v<version> as a draft with the CHANGELOG notes, the downloads and
#      SHA256SUMS.txt
#   4. publishes those exact tarballs to npm with provenance: every binary version first, the launcher last (it
#      pins them all), then gives the launcher its extra dist-tags (an alpha's `alpha`)
#   5. publishes the release, so the site's download links and the app's updater see it only once
#      everything is up
#   6. bumps the Homebrew tap (WispAgents/homebrew-tap): the wisp-agents formula to the new npm tarball and
#      the wisp cask to the release's Mac zips
# A push only releases a version npm doesn't have yet. Run it by hand (Actions → release → Run
# workflow) to finish one that stopped half way: every step skips what's already done (each npm
# package whose version is already on npm is skipped). With "dry run" ticked it builds the binaries,
# the npm tarballs (tested, kept as the npm-packages artifact) and the desktop apps, and publishes
# nothing: try a branch with `gh workflow run release --ref <branch> -f dry_run=true`.
#
# Nightly: when the nightly workflow (the full matrix, three times over) passes on main, this
# builds that commit as <next patch>-nightly.<yyyymmdd>.<hhmm> (scripts/nightly-version.mjs, from
# npm/wisp-agents/package.json's version), stamped into Cargo.toml for the binaries (so `wisp --version`
# says it) and into every npm package, publishes it to npm under `nightly` and moves the `nightly`
# release to it, with the Unreleased notes. Nothing happens when main hasn't moved since the last
# nightly. `gh workflow run release -f nightly=true` makes one now, without waiting for the tests.
#
# npm publishes through trusted publishing (OIDC, no token): on npmjs.com, wisp-agents → Settings trusts
# WispAgents/wisp, release.yml, environment `npm`. Every tarball is a version of wisp-agents (ADR-0094), so that one
# trusted publisher covers them all and nothing is ever published by hand. npm allows one trusted publisher per
# package, so stable and nightly both publish from here. The `npm`
# environment only deploys from main, and npm refuses publishes by token, so what reaches npm is what
# was merged to main: the PR review is the gate, as in most projects, with no approval step in the run.
#
# Secrets (all optional):
#   HOMEBREW_TAP_TOKEN          a token that can push to WispAgents/homebrew-tap; without it the tap is skipped
# Extra dist-tags (`alpha`) go through the same trusted publisher: on npmjs.com, wisp-agents → Settings →
# trusted publishing, "Allow npm dist-tag" must be on. Without it the release still ships (on `latest`) and
# the npm job warns with the command to run.
# The apps aren't signed: the Mac one is signed ad hoc (desktop/scripts/package.mjs, MAC_SIGN_IDENTITY
# for a Developer ID) and macOS asks to confirm the first open; SmartScreen warns on Windows.

on:
  push:
    branches: [main]
    paths: [Cargo.toml, npm/wisp-agents/package.json]
  workflow_run:
    workflows: [nightly]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the binaries, npm tarballs and desktop apps; release nothing
        type: boolean
        default: false
      nightly:
        description: Make a nightly from main now, without waiting for the nightly tests
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.nightly.outputs.go || steps.stable.outputs.go }}
      version: ${{ steps.nightly.outputs.version || steps.stable.outputs.version }}
      npm: ${{ steps.nightly.outputs.npm || steps.stable.outputs.npm }}
      prerelease: ${{ steps.nightly.outputs.prerelease || steps.stable.outputs.prerelease }}
      dry: ${{ steps.nightly.outputs.dry || steps.stable.outputs.dry }}
      channel: ${{ steps.nightly.outputs.channel || steps.stable.outputs.channel }}
      sha: ${{ steps.nightly.outputs.sha || steps.stable.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
      extra_tags: ${{ steps.tag.outputs.extra }}
      targets: ${{ steps.versions.outputs.targets }}
    steps:
      # A nightly builds the commit the nightly tests passed on, even if main has moved since.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Before anything is built: Cargo.toml, npm/wisp-agents/package.json (and its pins) and the tag
      # the run is on, if any, must name one version. The error says which file to fix.
      - id: versions
        name: Versions agree
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag=(); [ "$REF_TYPE" = tag ] && tag=(--tag "$REF_NAME")
          base=$(node npm/scripts/release.mjs check "${tag[@]}")
          echo "version $base in Cargo.toml and npm/wisp-agents/package.json"
          { echo "base=$base"; echo "targets=$(node npm/scripts/release.mjs matrix)"; } >> "$GITHUB_OUTPUT"
      - id: nightly
        if: github.event_name == 'workflow_run' || inputs.nightly == true
        name: Plan a nightly
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS: ${{ github.event.workflow_run.conclusion || 'skipped' }}
          BASE: ${{ steps.versions.outputs.base }}
        run: |
          sha=$(git rev-parse HEAD)
          last=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" -q .object.sha 2>/dev/null || true)
          version=$(node scripts/nightly-version.mjs "$BASE")
          go=true
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$TESTS" != success ]; then echo "The nightly tests didn't pass ($TESTS): no nightly."; go=false; fi
          if [ "$sha" = "$last" ]; then echo "main hasn't moved since the last nightly ($sha): no nightly."; go=false; fi
          echo "nightly $version from $sha → go=$go"
          { echo "channel=nightly"; echo "version=$version"; echo "sha=$sha"; echo "npm=$go"; echo "go=$go"; echo "prerelease=true"; echo "dry=false"; } >> "$GITHUB_OUTPUT"
      - id: stable
        if: github.event_name != 'workflow_run' && inputs.nightly != true
        name: Plan a release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ inputs.dry_run == true }}
          BASE: ${{ steps.versions.outputs.base }}
          BEFORE: ${{ github.event.before }}
        run: |
          version=$BASE
          # A push releases only when it changed the version: Cargo.toml also changes for dependencies.
          changed=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            prev=$( (git fetch -q --depth=1 origin "$BEFORE" && git show FETCH_HEAD:npm/wisp-agents/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version') 2>/dev/null || true)
            [ "$prev" = "$version" ] && changed=false
            echo "version before the push: ${prev:-unknown}, now $version"
          fi
          npm=true
          npm view "wisp-agents@$version" version 2>/dev/null | grep -q . && npm=false
          published=false
          [ "$(gh release view "v$version" --json isDraft -q .isDraft 2>/dev/null)" = false ] && published=true
          go=false
          # npm's registry can take a minute to list a version it just took, so a push right after
          # a release also checks the GitHub release: once that's published, the version is out.
          if [ "$GITHUB_EVENT_NAME" = push ]; then [ $changed = true ] && [ $npm = true ] && [ $published = false ] && go=true
          elif [ $npm = true ] || [ $published = false ]; then go=true; fi
          [ "$DRY" = true ] && go=true
          # a beta is a prerelease; a stable or alpha release isn't (the header, release.mjs releaseKind)
          prerelease=$(node npm/scripts/release.mjs prerelease "$version" stable)
          echo "version=$version changed=$changed npm-needed=$npm release-published=$published → go=$go"
          { echo "channel=stable"; echo "sha=$GITHUB_SHA"; echo "version=$version"; echo "npm=$npm"; echo "go=$go"; echo "prerelease=$prerelease"; echo "dry=$DRY"; } >> "$GITHUB_OUTPUT"
      - name: CHANGELOG has notes for this version
        if: steps.stable.outputs.go == 'true'
        run: node scripts/release-notes.mjs "${{ steps.stable.outputs.version }}" > /dev/null
      - name: The npm dist-tag
        id: tag
        if: steps.nightly.outputs.go == 'true' || steps.stable.outputs.go == 'true'
        env:
          VERSION: ${{ steps.nightly.outputs.version || steps.stable.outputs.version }}
          CHANNEL: ${{ steps.nightly.outputs.channel || steps.stable.outputs.channel }}
        run: |
          echo "tag=$(node npm/scripts/release.mjs npm-tag "$VERSION" "$CHANNEL")" | tee -a "$GITHUB_OUTPUT"
          echo "extra=$(node npm/scripts/release.mjs extra-tags "$VERSION" "$CHANNEL")" | tee -a "$GITHUB_OUTPUT"

  # `wisp` for every target the launcher knows (npm/wisp-agents/lib/resolve.js TARGETS), on the runner
  # release.mjs picks: Mac and Windows natively, Linux static musl for every arch through cargo-zigbuild.
  # A nightly's version is stamped into Cargo.toml first, so the binary reports it, and
  # `cargo update --workspace` moves only the workspace crates' lines in Cargo.lock: --locked still holds.
  # These same binaries are the release's wisp-bin-<os>-<arch>.tar.gz (the machines plugin's installer).
  binaries:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    name: wisp ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # rust-toolchain.toml's version, read from the checkout, so a toolchain bump needs no edit here
      - run: rustup toolchain install && rustup target add ${{ matrix.triple }} && rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-bin-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Stamp the nightly version
        if: needs.plan.outputs.channel == 'nightly'
        run: node npm/scripts/release.mjs stamp-cargo "$VERSION" && cargo update --workspace
      - name: Build
        run: |
          build=(build); [ "${{ matrix.zig }}" = true ] && build=(zigbuild)
          cargo "${build[@]}" --release --locked -p wisp --target ${{ matrix.triple }}
      - uses: actions/upload-artifact@v4
        with:
          name: wisp-bin-${{ matrix.target }}
          if-no-files-found: error
          path: target/${{ matrix.triple }}/release/${{ matrix.bin }}

  # The npm tarballs, built once and tested here; the npm job publishes these same files. No `npm`
  # environment here, so a dry run from a branch gets this far.
  packages:
    needs: [plan, binaries]
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # -o pipefail: a failed step in a pipe fails the step
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # apps/web/dist: the launcher carries it in web/ and sets WISP_WEB_DIR to it (wisp serve's web_dir())
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          pattern: wisp-bin-*
          path: bins
      - name: Fill every package (npm/scripts/build.mjs)
        run: |
          node npm/scripts/release.mjs matrix | node -e 'for (const e of JSON.parse(require("fs").readFileSync(0, "utf8"))) console.log(e.target, e.bin)' |
          while read -r target bin; do
            node npm/scripts/build.mjs --target "$target" --binary "bins/wisp-bin-$target/$bin" --web apps/web/dist --out npm/dist --version "$VERSION"
          done
      - name: The launcher's tests
        run: node --test npm/test/ # npm/test/package.json runs npm/scripts/test-all.mjs
      - name: Pack, in publish order
        run: |
          mkdir -p npm/packed
          node npm/scripts/release.mjs packages npm/dist | while read -r dir; do
            npm pack "$dir" --pack-destination npm/packed --json | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)' >> npm/packed/order.txt
          done
          cat npm/packed/order.txt
      - name: Every tarball holds what it must
        run: |
          # one per target, by name: a glob like wisp-agents-*.tgz would also match the launcher's tarball
          for target in $(node npm/scripts/release.mjs matrix | node -e 'for (const e of JSON.parse(require("fs").readFileSync(0, "utf8"))) console.log(e.target)'); do
            f="npm/packed/wisp-agents-$VERSION-$target.tgz"
            test -s "$f" || { echo "::error::no $f"; exit 1; }
            # a listing in a variable, not a pipe: grep -q quitting early would SIGPIPE tar under pipefail
            list=$(tar -tvzf "$f")
            grep -qE '^-rwx.* package/bin/wisp(\.exe)?$' <<<"$list" || { echo "::error::$f has no executable bin/wisp"; exit 1; }
          done
          list=$(tar -tzf "npm/packed/wisp-agents-$VERSION.tgz")
          grep -qx package/web/index.html <<<"$list" || { echo "::error::wisp-agents-$VERSION.tgz has no web/index.html"; exit 1; }
      # As npm would lay them out (the binary under its alias's folder), without the registry: nothing is on it yet.
      - name: The packed linux-x64 install runs
        run: |
          s=$(mktemp -d)
          mkdir -p "$s/node_modules/wisp-agents" "$s/node_modules/wisp-agents-linux-x64" "$s/home"
          tar -xzf "npm/packed/wisp-agents-$VERSION.tgz" -C "$s/node_modules/wisp-agents" --strip-components=1
          tar -xzf "npm/packed/wisp-agents-$VERSION-linux-x64.tgz" -C "$s/node_modules/wisp-agents-linux-x64" --strip-components=1
          wisp="$s/node_modules/wisp-agents/bin/wisp.js"
          got=$(node "$wisp" --version)
          [ "$got" = "$VERSION" ] || { echo "::error::wisp --version says $got, expected $VERSION"; exit 1; }
          WISP_HOME="$s/home" WISP_PORT=4791 node "$wisp" serve > "$s/serve.log" 2>&1 &
          pid=$!
          ok=false
          for _ in $(seq 1 60); do
            page=$(curl -fsS http://127.0.0.1:4791/ 2>/dev/null || true)
            if grep -qi '<!doctype html' <<<"$page"; then ok=true; break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ $ok != true ]; then cat "$s/serve.log"; echo "::error::wisp serve from the packed tarballs didn't serve the web UI"; exit 1; fi
          echo "wisp $got from the tarballs serves the web UI"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          if-no-files-found: error
          path: npm/packed/

  # The same build for every channel. A nightly's version is stamped into npm/wisp-agents/package.json
  # first: the app reads it from there, and it has to say it's a nightly to update from it.
  desktop:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    uses: ./.github/workflows/tauri-package.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.channel == 'nightly' && needs.plan.outputs.version || '' }}

  release:
    needs: [plan, binaries, desktop, packages]
    if: needs.plan.outputs.dry != 'true' && needs.plan.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: out
      - uses: actions/download-artifact@v4
        with:
          pattern: wisp-bin-*
          path: bins
      # wisp-bin-<os>-<arch>.tar.gz, `wisp` at its root: what plugins/machines/core/bootstrap.sh installs on a
      # remote machine, checked against SHA256SUMS.txt
      - name: Pack the bare binaries
        run: |
          for d in bins/wisp-bin-*; do
            chmod +x "$d"/wisp* && tar -czf "out/$(basename "$d").tar.gz" -C "$d" .
          done
          ls out/wisp-bin-*.tar.gz
      # wisp from npm opens its window from these (bin/desktop-shell.js): without one, a tab.
      - name: The shell archives are there
        run: for a in mac-arm64 mac-x64 windows-x64 windows-arm64; do test -s "out/wisp-shell-$a.tar.gz" || { echo "::error::no wisp-shell-$a.tar.gz"; exit 1; }; done
      - name: Draft the release and upload the downloads
        run: |
          node scripts/release-notes.mjs "$TAG" > notes.md
          (cd out && sha256sum wisp-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          pre=(); [ "${{ needs.plan.outputs.prerelease }}" = true ] && pre=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA" "${pre[@]}"
          fi
          gh release upload "$TAG" out/* --clobber

  # A stable release goes to npm once its draft is up; a nightly once its desktop builds are. It
  # publishes the tarballs the packages job tested, in its order.txt: every binary version (<version>-<os>-<arch>)
  # first, then the launcher, skipping any version npm already has, so a re-run finishes a half-done publish.
  npm:
    needs: [plan, packages, desktop, release]
    if: ${{ !cancelled() && needs.plan.outputs.npm == 'true' && needs.plan.outputs.dry != 'true' && needs.packages.result == 'success' && needs.desktop.result == 'success' && (needs.release.result == 'success' || (needs.release.result == 'skipped' && needs.plan.outputs.channel == 'nightly')) }}
    runs-on: ubuntu-latest
    # Deploys only from main. npm's trusted publisher for wisp-agents is bound to this repo, release.yml and this
    # environment, so nothing else can publish.
    environment: npm
    permissions:
      contents: read
      id-token: write # provenance, and trusted publishing
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5+
      # release.mjs only (publish-tag): the tarballs come from the packages job
      - uses: actions/checkout@v5
        with:
          sparse-checkout: npm
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: packed
      - name: Publish
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          [ -n "$TAG" ] || { echo "::error::the plan job gave no npm dist-tag"; exit 1; }
          # fd 3, so nothing npm runs can read the rest of the list from stdin
          while read -r tgz <&3; do
            pkg=$(tar -xzOf "packed/$tgz" package/package.json | node -e 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log(`${p.name}@${p.version}`)')
            # the launcher under the release's tag, each binary (<version>-<os>-<arch>) under platform-<os>-<arch>;
            # anything else isn't this release's and stops the run
            tag=$(node npm/scripts/release.mjs publish-tag "${pkg##*@}" "$VERSION" "$TAG") || exit 1
            # Another run may have published it since the plan looked.
            if [ -n "$(npm view "$pkg" version 2>/dev/null || true)" ]; then echo "$pkg is already on npm: skipped."; continue; fi
            # ./ keeps npm from reading packed/<file> as a GitHub user/repo shorthand (EALLOWGIT)
            npm publish "./packed/$tgz" --provenance --access public --tag "$tag"
          done 3< packed/order.txt
      # npm publish takes one --tag: an alpha also gets `alpha` (the trusted publisher needs "Allow npm dist-tag").
      # Not fatal: the release is out on `latest` either way, and the warning says how to add it.
      - name: Extra dist-tags
        if: needs.plan.outputs.extra_tags != ''
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          EXTRA: ${{ needs.plan.outputs.extra_tags }}
        run: |
          for t in $EXTRA; do
            if [ "$(npm view "wisp-agents@$t" version 2>/dev/null || true)" = "$VERSION" ]; then echo "$t is already $VERSION."; continue; fi
            if npm dist-tag add "wisp-agents@$VERSION" "$t"; then echo "wisp-agents@$t → $VERSION" >> "$GITHUB_STEP_SUMMARY"
            else echo "::warning::couldn't tag wisp-agents@$VERSION as $t: turn on \"Allow npm dist-tag\" in wisp-agents' trusted publishing settings on npmjs.com, then re-run only this npm job of this run (it keeps the plan's outputs and skips what's published; a new run or Re-run all jobs skips npm, as the version is there), or run npm dist-tag add wisp-agents@$VERSION $t."; fi
          done

  publish:
    needs: [plan, release, npm]
    if: ${{ !cancelled() && needs.plan.outputs.channel == 'stable' && needs.release.result == 'success' && (needs.npm.result == 'success' || needs.npm.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - name: Publish the release
        run: |
          latest=(--latest); [ "${{ needs.plan.outputs.prerelease }}" = true ] && latest=(--latest=false)
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${latest[@]}"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

  # The rolling `nightly` release: its downloads are replaced first, then its tag moves to the
  # commit and its title names the version, which is what the app's updater reads. Its download
  # links (releases/download/nightly/<name>) never change.
  nightly:
    needs: [plan, binaries, desktop, npm]
    if: ${{ !cancelled() && needs.plan.outputs.channel == 'nightly' && needs.npm.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: out
      - uses: actions/download-artifact@v4
        with:
          pattern: wisp-bin-*
          path: bins
      # wisp-bin-<os>-<arch>.tar.gz, `wisp` at its root: what plugins/machines/core/bootstrap.sh installs on a
      # remote machine, checked against SHA256SUMS.txt
      - name: Pack the bare binaries
        run: |
          for d in bins/wisp-bin-*; do
            chmod +x "$d"/wisp* && tar -czf "out/$(basename "$d").tar.gz" -C "$d" .
          done
          ls out/wisp-bin-*.tar.gz
      - name: The shell archives are there
        run: for a in mac-arm64 mac-x64 windows-x64 windows-arm64; do test -s "out/wisp-shell-$a.tar.gz" || { echo "::error::no wisp-shell-$a.tar.gz"; exit 1; }; done
      - name: Update the nightly release
        run: |
          node scripts/release-notes.mjs --nightly "$VERSION" "$SHA" > notes.md
          (cd out && sha256sum wisp-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly out/* --clobber
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" -f sha="$SHA" -F force=true > /dev/null
            gh release edit nightly --title "wisp $VERSION" --notes-file notes.md --prerelease --latest=false
          else
            gh release create nightly out/* --title "wisp $VERSION" --notes-file notes.md --target "$SHA" --prerelease --latest=false
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/nightly: $VERSION" >> "$GITHUB_STEP_SUMMARY"

  # Homebrew installs wisp-agents from npm (packaging/homebrew/wisp-agents.rb): npm then pulls the
  # wisp-agents-darwin-<arch> package for the Mac it runs on, which the npm job published first. The tap's
  # cask (Casks/wisp.rb, the app) gets the version and the Mac zips' sha256 from the release's SHA256SUMS.txt.
  # A stable or alpha release bumps both; a beta or nightly neither.
  homebrew:
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.plan.outputs.prerelease != 'true' }}
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Bump WispAgents/homebrew-tap
        run: |
          if [ -z "$TOKEN" ]; then echo "::notice::No HOMEBREW_TAP_TOKEN secret: bump the tap by hand."; exit 0; fi
          url="https://registry.npmjs.org/wisp-agents/-/wisp-agents-$VERSION.tgz"
          for i in $(seq 1 30); do curl -fsSLo pkg.tgz "$url" && break; sleep 10; done # the CDN can lag the publish
          test -s pkg.tgz || { echo "::error::$url never came up"; exit 1; }
          sha=$(sha256sum pkg.tgz | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/WispAgents/homebrew-tap.git" tap
          sed -e "s#^  url \".*\"#  url \"$url\"#" -e "s#^  sha256 \".*\"#  sha256 \"$sha\"#" packaging/homebrew/wisp-agents.rb > tap/Formula/wisp-agents.rb
          if [ -f tap/Casks/wisp.rb ]; then
            gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir sums
            arm=$(awk '$2 == "wisp-mac-arm64.zip" { print $1 }' sums/SHA256SUMS.txt)
            intel=$(awk '$2 == "wisp-mac-x64.zip" { print $1 }' sums/SHA256SUMS.txt)
            [ -n "$arm" ] && [ -n "$intel" ] || { echo "::error::SHA256SUMS.txt of v$VERSION has no wisp-mac-arm64.zip or wisp-mac-x64.zip"; exit 1; }
            sed -i -e "s#^  version \".*\"#  version \"$VERSION\"#" -e "s#^\(  sha256 arm: *\)\"[^\"]*\"#\1\"$arm\"#" -e "s#^\( *intel: *\)\"[^\"]*\"#\1\"$intel\"#" tap/Casks/wisp.rb
            grep -q "^  version \"$VERSION\"" tap/Casks/wisp.rb && grep -q "$arm" tap/Casks/wisp.rb && grep -q "$intel" tap/Casks/wisp.rb || { echo "::error::Casks/wisp.rb didn't take $VERSION"; exit 1; }
          fi
          cd tap
          if git diff --quiet; then echo "The tap already has $VERSION."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "wisp-agents $VERSION"
          git push
