# ADR-0011's server budgets (cold start, idle RSS, the task list, patch latency, append rate, write amplification)
# against a real `wisp serve`, gated in PR CI (ADR-0080, ADR-0082). Its own workspace, as spikes/events: the main `cargo build/clippy/test
# --workspace` never compiles it.
[package]
name = "server-budgets"
version = "0.0.0"
edition = "2024"
publish = false
# `src/bin/steps.rs` (the stream's evidence) is the second bin; a bare `cargo run` stays the gate
default-run = "server-budgets"

[workspace]

[dependencies]
serde_json = "1"
# the append rate: spikes/events' own measurement (its lib), gated here in PR CI (ADR-0082)
events-bench = { path = "../events" }
tokio = { version = "1", features = ["rt-multi-thread"] }
# the seed: the runtime's own schema and `repo::save_session`, the fixture builder its list bench uses
wisp-runtime = { path = "../../plugins/runtime/host" }
wisp-runtime-api = { path = "../../plugins/runtime/api" }
wisp-runtime-core = { path = "../../plugins/runtime/core" }
wisp-store = { path = "../../crates/wisp-store" }
# `steps`: real transcripts through wisp's own Claude parser, as `drive.rs` reads them
wisp-claude-core = { path = "../../plugins/claude/core" }
wisp-harness-kit = { path = "../../crates/wisp-harness-kit" }

# the root's `budgets` profile, setting for setting: CI builds `wisp` and this spike with `--profile budgets` into one
# target dir, so the dependencies both use compile once
[profile.budgets]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
opt-level = 3
